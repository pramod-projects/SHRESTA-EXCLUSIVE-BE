<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
  <title>{{subject}}</title>
  <style>
    html, body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
    table { border-collapse: collapse !important; border-spacing: 0 !important; }
    img { border: 0; display: block; line-height: 100%; }
    a { color: #26456f; }
    .button:hover { background: #26456f !important; }
    @media only screen and (max-width: 620px) {
      .shell { width: 100% !important; }
      .outer { padding: 20px 12px !important; }
      .header { padding: 28px 24px 24px !important; }
      .content { padding: 32px 24px 28px !important; }
      .footer { padding: 24px !important; }
      .title { font-size: 30px !important; line-height: 36px !important; }
      .button-cell, .button-link { display: block !important; width: 100% !important; box-sizing: border-box !important; text-align: center !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#f5efe2;color:#2f2115;font-family:Arial,'Helvetica Neue',sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;mso-hide:all;">{{preheader}}&#847;&zwnj;&nbsp;&#8199;&#65279;&#847;&zwnj;&nbsp;&#8199;&#65279;</div>
  <table role="presentation" width="100%" style="width:100%;background:#f5efe2;">
    <tr>
      <td class="outer" align="center" style="padding:40px 16px;">
        <table role="presentation" class="shell" width="600" style="width:600px;max-width:600px;background:#ffffff;border:1px solid #e8d7bb;">
          <tr>
            <td class="header" style="padding:32px 40px 28px;background:#0f213d;border-bottom:4px solid #d8b35a;">
              <a href="https://shrestaexclusive.com" aria-label="SHRESTA Exclusive" style="display:inline-block;color:#ffffff;text-decoration:none;">
                <span style="display:block;font-family:Georgia,'Times New Roman',serif;font-size:29px;line-height:32px;font-weight:700;letter-spacing:2px;">SHRESTA</span>
                <span style="display:block;margin-top:4px;color:#e7c677;font-size:10px;line-height:14px;font-weight:700;letter-spacing:3px;">EXCLUSIVE</span>
              </a>
            </td>
          </tr>
          <tr>
            <td class="content" style="padding:40px 40px 36px;">{{content}}</td>
          </tr>
          <tr>
            <td class="footer" style="padding:28px 40px;background:#f8efe0;border-top:1px solid #e8d7bb;color:#6e5a46;font-size:12px;line-height:19px;">
              <p style="margin:0 0 8px;">Need help? Email <a href="mailto:{{supportEmail}}" style="color:#26456f;font-weight:700;text-decoration:none;">{{supportEmail}}</a> or call <a href="tel:{{supportPhoneDial}}" style="color:#26456f;font-weight:700;text-decoration:none;">{{supportPhoneDisplay}}</a>.</p>
              <p style="margin:0;">This is a transactional message from SHRESTA Exclusive. Please do not share security codes or account links.</p>
              <p style="margin:14px 0 0;color:#8b7863;">&copy; SHRESTA Exclusive</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
