spring:
  application:
    name: shresta-be
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5442/shresta}
    username: ${DATABASE_USERNAME:shresta_app}
    password: ${DATABASE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: ${SHRESTA_FLYWAY_LOCATIONS:classpath:db/migration}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6389}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  mail:
    host: ${SHRESTA_MAIL_HOST:}
    port: ${SHRESTA_MAIL_PORT:587}
    username: ${SHRESTA_MAIL_USERNAME:}
    password: ${SHRESTA_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SHRESTA_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SHRESTA_MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mail:
      enabled: false
  info:
    env:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level service=shresta-be trace_id=%X{traceId:-none} thread=%thread logger=%logger{36} msg=%msg%n"

shresta:
  platform:
    architecture: modular-monolith
    money-unit: paise
    cart-state: redis-primary
    payment-truth: razorpay-webhook
  media:
    asset-base-url: ${SHRESTA_MEDIA_ASSET_BASE_URL:}
    delivery-mode: ${SHRESTA_MEDIA_DELIVERY_MODE:s3-compatible}
  assets:
    local-storage-root: ${SHRESTA_ASSET_STORAGE_ROOT:var/shresta-assets}
    storage-provider: ${SHRESTA_ASSET_STORAGE_PROVIDER:s3-compatible}
    delivery-mode: ${SHRESTA_ASSET_DELIVERY_MODE:s3-compatible}
    object-upload-enabled: ${SHRESTA_ASSET_OBJECT_UPLOAD_ENABLED:false}
    object-endpoint: ${SHRESTA_ASSET_OBJECT_ENDPOINT:}
    object-bucket: ${SHRESTA_ASSET_OBJECT_BUCKET:}
    object-region: ${SHRESTA_ASSET_OBJECT_REGION:}
    object-access-key: ${SHRESTA_ASSET_OBJECT_ACCESS_KEY:}
    object-secret-key: ${SHRESTA_ASSET_OBJECT_SECRET_KEY:}
    object-path-style: ${SHRESTA_ASSET_OBJECT_PATH_STYLE:true}
    object-cache-control: ${SHRESTA_ASSET_OBJECT_CACHE_CONTROL:public,max-age=31536000,immutable}
  admin:
    api-key: ${SHRESTA_ADMIN_API_KEY:local-shresta-admin-key}
  kv:
    enabled: ${SHRESTA_KV_ENABLED:true}
    key-prefix: ${SHRESTA_KV_KEY_PREFIX:shresta:local}
    tables:
      category_family_config:
        enabled: ${SHRESTA_KV_CATEGORY_FAMILY_ENABLED:true}
        ttl: ${SHRESTA_KV_CATEGORY_FAMILY_TTL:300s}
      category_product_type_config:
        enabled: ${SHRESTA_KV_CATEGORY_PRODUCT_TYPE_ENABLED:true}
        ttl: ${SHRESTA_KV_CATEGORY_PRODUCT_TYPE_TTL:300s}
      category_attribute_config:
        enabled: ${SHRESTA_KV_CATEGORY_ATTRIBUTE_ENABLED:true}
        ttl: ${SHRESTA_KV_CATEGORY_ATTRIBUTE_TTL:300s}
      category_filter_config:
        enabled: ${SHRESTA_KV_CATEGORY_FILTER_ENABLED:true}
        ttl: ${SHRESTA_KV_CATEGORY_FILTER_TTL:300s}
      category_tax_config:
        enabled: ${SHRESTA_KV_CATEGORY_TAX_ENABLED:true}
        ttl: ${SHRESTA_KV_CATEGORY_TAX_TTL:300s}
      category_styling_config:
        enabled: ${SHRESTA_KV_CATEGORY_STYLING_ENABLED:true}
        ttl: ${SHRESTA_KV_CATEGORY_STYLING_TTL:300s}
      storefront_home_sections:
        enabled: ${SHRESTA_KV_STOREFRONT_SECTIONS_ENABLED:true}
        ttl: ${SHRESTA_KV_STOREFRONT_SECTIONS_TTL:120s}
      storefront_home_items:
        enabled: ${SHRESTA_KV_STOREFRONT_ITEMS_ENABLED:true}
        ttl: ${SHRESTA_KV_STOREFRONT_ITEMS_TTL:120s}
      media_assets:
        enabled: ${SHRESTA_KV_MEDIA_ASSETS_ENABLED:true}
        ttl: ${SHRESTA_KV_MEDIA_ASSETS_TTL:120s}
      media_asset_variants:
        enabled: ${SHRESTA_KV_MEDIA_ASSET_VARIANTS_ENABLED:true}
        ttl: ${SHRESTA_KV_MEDIA_ASSET_VARIANTS_TTL:120s}
      storefront_store_sections:
        enabled: ${SHRESTA_KV_STOREFRONT_STORE_SECTIONS_ENABLED:true}
        ttl: ${SHRESTA_KV_STOREFRONT_STORE_SECTIONS_TTL:120s}
      store_locations:
        enabled: ${SHRESTA_KV_STORE_LOCATIONS_ENABLED:true}
        ttl: ${SHRESTA_KV_STORE_LOCATIONS_TTL:120s}
  mutation:
    idempotency:
      enabled: ${SHRESTA_IDEMPOTENCY_ENABLED:true}
      require-key: ${SHRESTA_IDEMPOTENCY_REQUIRE_KEY:true}
      ttl: ${SHRESTA_IDEMPOTENCY_TTL:24h}
    locking:
      enabled: ${SHRESTA_MUTATION_LOCKING_ENABLED:true}
      ttl: ${SHRESTA_MUTATION_LOCK_TTL:30s}
  sms:
    enabled: ${SHRESTA_SMS_ENABLED:false}
    spring-edge-endpoint: ${SHRESTA_SMS_SPRINGEDGE_ENDPOINT:https://instantalerts.co/api/web/send}
    spring-edge-api-key: ${SHRESTA_SMS_SPRINGEDGE_API_KEY:}
    spring-edge-sender: ${SHRESTA_SMS_SPRINGEDGE_SENDER:SHRSTA}
    spring-edge-route: ${SHRESTA_SMS_SPRINGEDGE_ROUTE:transactional}
    msg91-endpoint: ${SHRESTA_SMS_MSG91_ENDPOINT:https://api.msg91.com/api/v2/sendsms}
    msg91-auth-key: ${SHRESTA_SMS_MSG91_AUTH_KEY:}
    msg91-sender: ${SHRESTA_SMS_MSG91_SENDER:SHRSTA}
    msg91-route: ${SHRESTA_SMS_MSG91_ROUTE:4}
    msg91-country: ${SHRESTA_SMS_MSG91_COUNTRY:91}
  mail:
    enabled: ${SHRESTA_MAIL_ENABLED:false}
    from-address: ${SHRESTA_MAIL_FROM:no-reply@shrestaexclusive.com}
    registration-otp-subject: ${SHRESTA_MAIL_REGISTRATION_OTP_SUBJECT:Your SHRESTA registration OTP}
    invoice-subject-prefix: ${SHRESTA_MAIL_INVOICE_SUBJECT_PREFIX:SHRESTA Invoice}
  razorpay:
    webhook:
      enabled: ${SHRESTA_RAZORPAY_WEBHOOK_ENABLED:false}
      secret: ${SHRESTA_RAZORPAY_WEBHOOK_SECRET:${RAZORPAY_WEBHOOK_SECRET:}}

---
spring:
  config:
    activate:
      on-profile: "local | dev | uat"
  flyway:
    # Local databases may carry older migration lineage; keep non-prod restarts resilient.
    validate-on-migrate: false
    ignore-migration-patterns: "*:missing"
  # Seed data is now handled by DatabaseSeeder (reads db/seed/**/*.json).
  # No separate Flyway location needed for non-prod environments.
