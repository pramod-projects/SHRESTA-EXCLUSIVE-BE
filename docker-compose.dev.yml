# Local DEV dependencies only. UAT/PROD use managed PostgreSQL, Redis, and Cloudflare R2.
services:
  postgres:
    # Durable local application database; port 5442 avoids a common host PostgreSQL port.
    image: postgres:16-alpine
    container_name: shresta-postgres
    environment:
      POSTGRES_DB: shresta
      POSTGRES_USER: shresta_app
      POSTGRES_PASSWORD: change-me
    ports:
      - "5442:5432"
    volumes:
      - shresta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shresta_app -d shresta"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Local cache, idempotency, and mutation-lock store with persistence across restarts.
    image: redis:7-alpine
    container_name: shresta-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6389:6379"
    volumes:
      - shresta_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # DEV-only Cloudflare R2 substitute. It exercises the same S3 protocol and presigned PUT flow.
    # Do not deploy MinIO in UAT/PROD; point those environments directly at Cloudflare R2.
    image: minio/minio:latest
    container_name: shresta-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
    ports:
      # 9010 is the S3/public object API; 9011 is the local operator console.
      - "9010:9000"
      - "9011:9001"
    volumes:
      - shresta_minio_data:/data

  minio-setup:
    # One-shot initializer: creates the DEV bucket, enables public reads, and seeds catalog media.
    image: minio/mc:latest
    container_name: shresta-minio-setup
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      SHRESTA_MINIO_BUCKET: ${R2_BUCKET_NAME:?R2_BUCKET_NAME is required}
    volumes:
      - ./seed/shresta-media:/seed/shresta-media:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 2
        done
        mc mb -p "local/$$SHRESTA_MINIO_BUCKET"
        mc anonymous set download "local/$$SHRESTA_MINIO_BUCKET"
        mc mirror --overwrite --exclude '*/.DS_Store' /seed/shresta-media "local/$$SHRESTA_MINIO_BUCKET"

volumes:
  # Named volumes preserve local state when containers are recreated.
  shresta_postgres_data:
  shresta_redis_data:
  shresta_minio_data:
